name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: cd apps/web && npx eslint . 2>&1; echo "EXIT_CODE=$?"
        continue-on-error: true

      - name: Build types
        run: pnpm --filter shiro-types build

      - name: Build web
        id: buildweb
        continue-on-error: true
        run: cd apps/web && pnpm run build:ci 2>&1 | tail -80

      - name: Check build result
        if: steps.buildweb.outcome == 'failure'
        run: |
          echo "::error::Build failed! Check the 'Build web' step for details."
          exit 1
