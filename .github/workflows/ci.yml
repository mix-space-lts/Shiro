name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: cd apps/web && npx eslint . 2>&1; echo "EXIT_CODE=$?"
        continue-on-error: true

      - name: Build types
        run: pnpm --filter shiro-types build

      - name: Build web
        id: buildweb
        run: |
          set -o pipefail
          cd apps/web && pnpm run build:ci 2>&1 | tail -80

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiro-web-build
          path: apps/web/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
