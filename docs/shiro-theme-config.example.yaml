# =============================================================================
# Shiro 主题配置示例
# =============================================================================
# 使用方法：粘贴到 Mix Space 后台「附加功能 → 配置与云函数 → 引用：theme → 名称：shiro」
# 只写需要覆盖的字段，未写的字段自动使用默认值。
#
# 本文件可直接整体应用，效果与留空（完全使用默认值）一致。
# 需要自定义时，参考各字段注释和 $replace 用法示例进行修改。
#
# 以 $ 开头的键（$replace / $idkey）是保留元键，用户配置请勿用 $ 自定义键。
# 旧语法 replace / idkey 仍被接受，但会 console.warn deprecation。
#
# ⚠️ 新增配置字段时，需同步改以下文件：
#   1. apps/web/src/app.config.d.ts —— TypeScript 类型
#   2. apps/web/src/app.default.theme-config.ts —— 默认值（schema）
#   3. 消费该配置的组件代码
# =============================================================================

config:
  # ===== 站点基础设置 =====
  site:
    favicon: /favicon.ico          # 浅色模式下的网站图标
    faviconDark: /favicon.ico       # 深色模式下的网站图标

  # ===== 首页 Hero 区域 =====
  hero:
    # type 是 HTML 标签名：h1 h2 h3 h4 h5 h6 span code br div p ...
    # text 是标签内的文本内容
    # class 是 Tailwind CSS / 自定义 CSS 类名
    title:
      # $replace: true 清除默认 template，完全自定义标题
      $replace: true
      template:
        - type: h1
          text: "Hi, I'm "
          class: font-light text-4xl
        - type: h1
          text: Your Name
          class: font-medium mx-2 text-4xl
        - type: br     # 换行
        - type: h1
          text: "A Full Stack "
          class: font-light text-4xl
        - type: code
          text: "<Developer />"
          class: font-medium mx-2 text-3xl rounded p-1 bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-900 transition-colors duration-200
        - type: span
          class: inline-block w-[1px] h-8 -bottom-2 relative bg-zinc-800/80 dark:bg-zinc-200/80 opacity-0 group-hover:opacity-100 transition-opacity duration-200 group-hover:animation-blink

    description: A personal space for writing and sharing.

    # 一言（hitokoto），未配则用 description
    hitokoto:
      random: true             # true=随机一言 false=固定文本
      # custom: "自定义固定文本（random=false 时生效）"

  # ===== 主题色（可选，不配则用默认） =====
  # 用于文章标签、链接 hover 等装饰性元素的循环配色
  # 成对结构：每个对象的 light/dark 一一对应
  color:
    - light: "#33A6B8"
      dark: "#F596AA"
    - light: "#FF6666"
      dark: "#A0A7D4"
    - light: "#26A69A"
      dark: "#ff7b7b"

  # ===== 自定义 CSS / JS / 外部资源 =====
  # 不写 custom 则不注入任何资源；写空数组会注入空标签，建议按需填写
  # custom:
  #   css: []                    # 外部 CSS 样式表链接（<link href="...">）
  #   styles: []                 # 内联 <style> 标签中的 CSS 字符串
  #   js: []                     # 内联 <script> 标签中的 JS 字符串
  #   scripts: []                # 外部 <script> 标签，写法见 Next.js Script Props: https://nextjs.org/docs/app/api-reference/components/script#props

  # ===== 功能模块开关 =====
  module:
    # -- 订阅号召（可选） --
    # subscription:
    #   tg: ""                   # Telegram 频道链接，留空不显示

    # -- OG 图片（可选） --
    # og:
    #   avatar: ""               # 默认 OG 头像 URL，留空则用站点主人头像

    # -- 捐赠弹窗 --
    donate:
      enable: false            # 是否启用
      link: ""                 # 捐赠页面链接
      qrcode: []               # 收款二维码图片 URL 数组

    # -- B站直播间状态 --
    bilibili:
      liveId: 0                # 直播间 ID，填 0 则不启用

    # -- RSS 订阅 --
    rss:
      custom_elements: []      # 自定义 RSS 元素（高级用法）
      noRSS: false             # true=禁用 RSS 订阅

    # -- 底部署名 SVG（可选） --
    signature:
      svg: ""                  # SVG 源码字符串，留空不显示
      animated: true           # 是否播放 SVG 动画

    # -- 文章列表展示模式 --
    posts:
      mode: loose              # loose=宽松（大图卡片） | compact=紧凑（小图列表）
      outdated_days: 60        # 文章过期提示阈值（天）。超过此天数显示 "这篇文章上次修改于 xxx" 警告。填 0 永不显示。默认 60

    # 各板块开关（设为 false 时从导航栏移除该项，对应页面返回 404）
    notes:
      enable: true
    noteTopics:
      enable: true
    timeline:
      enable: true
    thinking:
      enable: true
    says:
      enable: true
    friends:
      enable: true
    projects:
      enable: true
    travel:
      enable: true

    # -- 自定义导航栏（可选） --
    # 默认按 path 合并（$idkey: path 在默认模板中声明）。
    # $replace 用法（数组元素）：
    #   用法 1：按 path 匹配默认项，$replace 清除该项默认值后重建
    #     nav:
    #       items:
    #         - path: /posts
    #           $replace: true
    #           title: Blog
    #           subMenu: []
    #   用法 2：按 path 匹配默认项，部分覆盖（无 $replace 则递归合并）
    #     nav:
    #       items:
    #         - path: /notes
    #           subMenu:
    #             - titleKey: nav_topics
    #               path: /notes/series
    #   用法 3：无匹配的 path → 追加为新项
    #     nav:
    #       items:
    #         - title: 归档
    #           path: /archive
    #           icon: timeline

    # -- 首页风向标（可选） --
    # 数组默认按 path 合并。不设置 items 时自动从 nav 顶级项生成。
    # 图标 icon 支持三种形式：内置 key / base64 / 外链
    # 文本优先级：titleKey（i18n key）→ title（字面量）→ path（兜底）
    # --- 示例 ---
    # windsock:
    #   items:
    #     - titleKey: windsock_posts
    #       icon: posts
    #       path: /posts
    #     - title: 友链
    #       icon: friends
    #       path: /friends

  # ===== Powered by（可选） =====
  poweredBy:
    vercel: false              # 部署在 Vercel 且为 true 时显示 "Powered by Vercel"

# =============================================================================
# 页脚配置
# =============================================================================
footer:
  # -- 页脚导航链接组 --
  # 默认按 name 合并（$idkey: name 在默认模板中声明）。
  # $replace 用法（数组元素）：
  #   用法 1：纯标记 {$replace: true} → 清除整个默认数组，从头定义
  #     linkSections:
  #       - $replace: true
  #       - name: 更多
  #         links: [...]
  #   用法 2：按 name 匹配默认项，$replace 清除该项默认 links 后重建
  #     linkSections:
  #       - name: 更多
  #         $replace: true
  #         links: [...]
  linkSections:
    - name: 更多
      links:
        - name: 时间线
          href: /timeline
          external: false      # true=外链（新标签页打开） false=站内路由
        - name: 友链
          href: /friends
          external: false
    - name: 联系
      links:
        - name: 写留言
          href: /message
          external: false
        - name: 发邮件
          href: mailto:me@example.com
          external: true
        - name: GitHub
          href: https://github.com/you
          external: true

  # -- 页脚信息 --
  otherInfo:
    date: "1970-{{now}}"      # {{now}} 自动替换为当前年份
    motto: Stay hungry. Stay foolish.  # 页脚座右铭，留空则不显示
    # icp 不写则不渲染 ICP 备案信息；写 {text:"",link:""} 会渲染空链接，请按需填写
    # icp:
    #   text: ""
    #   link: ""
